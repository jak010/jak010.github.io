name: Update Tech Blog Posts

on:
  schedule:
    - cron: '0 0 * * *' # 매일 자정(UTC)에 실행
  workflow_dispatch: # 수동 실행 옵션 추가

jobs:
  update-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-analytics-data

      - name: Run scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: |
          # Create credentials file from secret
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_key.json
          
          python scripts/update_blog_posts.py
          python scripts/update_popular_posts.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet || echo "modified=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.md
          git commit -m "docs: 자동 업데이트 - 최근 기술 블로그 포스트 반영"
          git push
